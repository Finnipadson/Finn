      <div class="row"><span style="width:84px">Musik</span><div class="grow">${sl('set-music', s.music)}</div><output id="o-music">${Math.round(s.music * 100)}</output></div>
    </div>
    <div class="card section"><span class="label">Rätseltypen</span>
      <div class="toggles">${CONFIG.TYPES.map(t => `<button class="tgl ${s.types[t] ? 'on' : ''}" data-type="${t}"><span class="box">${icon('check')}</span>${CONFIG.TYPE_NAME[t]}</button>`).join('')}</div>
      <p class="note">Mindestens ein Typ bleibt aktiv. Level mit abgewählten Typen bekommen automatisch einen anderen.</p>
    </div>
    <div class="card section"><span class="label">Aussehen</span>
      <div class="swatches">${THEMES.map(([id, name, c]) => `<button class="sw ${s.theme === id ? 'on' : ''}" data-theme-id="${id}"><span class="chipc"><i style="background:${c[0]}"></i><i style="background:${c[1]}"></i></span>${name}</button>`).join('')}</div>
    </div>
    <div class="card section"><span class="label">Daten</span>
      <div class="row"><span class="grow">Alle Level, Sterne, Statistiken und Erfolge löschen. Einstellungen bleiben.</span></div>
      <button class="btn" data-a="reset" style="width:100%;margin-top:8px;color:var(--bad)">Fortschritt zurücksetzen</button>
    </div>`;
  for (const k of ['sfx', 'music']) {
    const inp = $('#set-' + k);
    inp.addEventListener('input', () => {
      S.settings[k] = inp.value / 100; inp.style.setProperty('--p', inp.value + '%'); $('#o-' + k).textContent = inp.value;
      Sound.unlock(); Sound.apply();
    });
    inp.addEventListener('change', () => { persist(); if (k === 'sfx') Sound.play('correct'); });
  }
}
$('#settings').addEventListener('click', e => {
  const t = e.target.closest('[data-type]');
  if (t) {
    const ty = t.dataset.type, on = S.settings.types[ty];
    if (on && enabledTypes().length <= 1 && CONFIG.TYPES.filter(x => S.settings.types[x]).length <= 1) { Sound.play('wrong'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); return; }
    S.settings.types[ty] = !on; persist(); Sound.play('click'); renderSettings(); return;
  }
  const th = e.target.closest('[data-theme-id]');
  if (th) { S.settings.theme = th.dataset.themeId; persist(); applyTheme(); Sound.play('click'); renderSettings(); return; }
  if (e.target.closest('[data-a=reset]')) {
    confirmBox('Wirklich zurücksetzen?', 'Alle Level, Sterne, Punkte, Statistiken und Erfolge gehen verloren. Das lässt sich nicht rückgängig machen.', 'Zurücksetzen', () => {
      const keep = S.settings; S = defaultSave(); S.settings = keep; persist(); openScreen('menu');
    });
  }
});

// ----- Statistik -----
function renderStats() {
  const levelsDone = Object.keys(S.stars).length, three = Object.values(S.stars).filter(x => x === 3).length;
  const pt = S.playTime, ptxt = pt >= 3600 ? `${Math.floor(pt / 3600)} h ${Math.floor(pt % 3600 / 60)} min` : `${Math.floor(pt / 60)} min`;
  const big = (l, v) => `<div class="card stat-big"><span class="label">${l}</span><b>${v}</b></div>`;
  $('#stats').innerHTML = topbar('Statistik') + `
    <div class="stat-grid">
      ${big('Level geschafft', levelsDone)}${big('Sterne', totalStars())}
      ${big('Punkte', fmtNum(totalScore()))}${big('Spielzeit', ptxt)}
      ${big('3-Sterne-Level', three)}${big('Daily-Serie', `${S.lastDaily === dateKey() || S.lastDaily === yesterdayKey() ? S.streak : 0} <small style="font-size:.9rem;color:var(--ink2)">/ max ${S.bestStreak}</small>`)}
    </div>
    ${CONFIG.TYPES.map(t => {
      const s = S.stats[t];
      return `<div class="card stat-type"><div class="hd">${typeIcon(t)} ${CONFIG.TYPE_NAME[t]}</div>
        <dl><dt>Gelöst</dt><dd>${s.solved}</dd><dt>Ø Zeit</dt><dd>${s.solved ? fmtTime(s.time / s.solved) : '–'}</dd>
        <dt>Bestzeit</dt><dd>${s.best !== null ? fmtTime(s.best) : '–'}</dd><dt>Fehlerfrei</dt><dd>${s.solved ? Math.round(s.perfect / s.solved * 100) + ' %' : '–'}</dd></dl></div>`;
    }).join('')}
    ${S.mathTasks ? `<p class="note" style="text-align:center">${fmtNum(S.mathTasks)} Kopfrechenaufgaben gelöst.</p>` : ''}`;
}

// ----- Erfolge -----
function renderAch() {
  const n = Object.keys(S.ach).length;
  $('#achievements').innerHTML = topbar('Erfolge', `${n} von ${ACH.length}`) + `<div class="ach-list">${ACH.map(a => {
    const t = S.ach[a.id];
    return `<div class="card ach ${t ? '' : 'locked'}"><div class="medal serif" style="font-size:1.3rem">${t ? a.n[0] : icon('lock')}</div>
      <div><b>${a.n}</b><small>${a.d}</small></div>${t ? `<time>${new Date(t).toLocaleDateString('de-DE')}</time>` : ''}</div>`;
  }).join('')}</div>`;
}

// ----- Training -----
function renderTraining() {
  $('#training').innerHTML = topbar('Training', 'Ein Typ, freie Schwierigkeit') + `
    <div class="type-pick">${CONFIG.TYPES.map(t => `<button class="btn tp ${trainType === t ? 'on' : ''}" data-tt="${t}">${typeIcon(t)}<span>${CONFIG.TYPE_NAME[t]}</span></button>`).join('')}</div>
    <span class="label" style="margin-bottom:8px;display:block">Schwierigkeit</span>
    <div class="seg">${CONFIG.TRAIN_LEVELS.map(([n], i) => `<button class="${trainLevel === i ? 'on' : ''}" data-tl="${i}">${n}</button>`).join('')}</div>
    <button class="btn primary" data-a="train" style="min-height:56px">Training starten ${icon('next')}</button>
    <p class="note" style="margin-top:14px">Trainingsrätsel sind jedes Mal neu und zählen nur für Statistik und Erfolge.</p>`;
}
$('#training').addEventListener('click', e => {
  const t = e.target.closest('[data-tt]'); if (t) { trainType = t.dataset.tt; Sound.play('click'); renderTraining(); return; }
  const l = e.target.closest('[data-tl]'); if (l) { trainLevel = +l.dataset.tl; Sound.play('click'); renderTraining(); return; }
  if (e.target.closest('[data-a=train]')) { Sound.play('click'); startTraining(); }
});

// ----- Daily -----
function renderDaily() {
  const key = dateKey(), res = S.daily[key], types = dailyTypes(key);
  const curStreak = (S.lastDaily === key || S.lastDaily === yesterdayKey()) ? S.streak : 0;
  let week = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    week += `<i class="${S.daily[dateKey(d)] ? 'on' : ''}">${d.toLocaleDateString('de-DE', { weekday: 'short' }).slice(0, 2)}</i>`;
  }
  $('#daily').innerHTML = topbar('Tägliche Challenge') + `
    <div class="card daily-card">
      <div class="label">Heute</div>
      <div class="daily-date">${new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      <div class="daily-types">${types.map(t => `<span title="${CONFIG.TYPE_NAME[t]}">${typeIcon(t)}</span>`).join('')}</div>
      ${res ? `<div style="margin-bottom:14px">${starsHTML(res.stars)}<div style="margin-top:6px;color:var(--ink2)"><b style="color:var(--ink)">${fmtNum(res.score)}</b> Punkte · ${fmtTime(res.time)}</div></div>
        <button class="btn" data-a="dailyfree" style="width:100%">${icon('replay')} Nochmal spielen (ohne Wertung)</button>`
      : `<p class="note" style="margin:0 0 16px">Drei Rätsel am Stück. Für alle gleich, einmal pro Tag gewertet.</p>
        <button class="btn primary" data-a="dailyplay" style="width:100%;min-height:54px">Challenge starten ${icon('next')}</button>`}
      <div class="streak">${week}</div>
      <p class="note">Serie: <b>${curStreak}</b> ${curStreak === 1 ? 'Tag' : 'Tage'} · Rekord: ${S.bestStreak}</p>
    </div>`;
}
$('#daily').addEventListener('click', e => {
  if (e.target.closest('[data-a=dailyplay]')) { Sound.play('click'); startDaily(true); }
  if (e.target.closest('[data-a=dailyfree]')) { Sound.play('click'); startDaily(false); }
});

// ============================================================
// GLOBALE EVENTS & LOOP
// ============================================================
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { Sound.play('click'); const id = nav.dataset.nav; if (id === 'map') { mapWorld = worldOf(S.unlocked); openMap(); } else openScreen(id); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'play') { Sound.play('click'); startLevel(S.unlocked); }
  else if (a.dataset.a === 'pause') { Sound.play('click'); pauseGame(); }
  else if (a.dataset.a === 'help' && G && G.pz) { Sound.play('click'); showTutorial(G.pz.type); }
});
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
document.addEventListener('keydown', e => {
  Sound.unlock();
  if ($('#ov-tut').classList.contains('active')) {
    if (e.key === 'Escape') closeTut();
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#tut-card [data-t=next]').click(); }
    return;
  }
  if ($('#ov-confirm').classList.contains('active')) { if (e.key === 'Escape') overlayOff('ov-confirm'); return; }
  if ($('#ov-pause').classList.contains('active')) { if (e.key === 'Escape') { Sound.play('click'); resumeGame(); } return; }
  if ($('#ov-result').classList.contains('active')) { if (e.key === 'Enter') { const b = $('#result-card .btn.primary'); if (b) b.click(); } return; }
  if (currentScreen === 'game' && G) {
    if (e.key === 'Escape' && !(G.inst && G.inst.key && G.inst.key(e))) { pauseGame(); return; }
    if (G.running && G.inst && G.inst.key && G.inst.key(e)) e.preventDefault();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sound.suspend(); if (currentScreen === 'game' && G && G.running) pauseGame(); }
  else Sound.resume();
});
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (G && G.inst && G.inst.resize) G.inst.resize(); }, 120); });

let lastTick = performance.now(), saveAcc = 0;
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - lastTick) / 1000); lastTick = now;
  if (G && G.running && !paused && !document.hidden && currentScreen === 'game') {
    G.time += dt; G.pz.time += dt; S.playTime += dt; saveAcc += dt;
    const el = $('#g-time'); if (el) el.lastElementChild.textContent = fmtTime(G.time);
    if (saveAcc > 15) { saveAcc = 0; persist(); }
  }
}, 250);

// ============================================================
// START
// ============================================================
applyTheme();
setAccent(worldOf(S.unlocked));
openScreen('menu');
</script>
</body>
</html>
