<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a1b">
<title>Burgwacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1c2a1b; --bg2: #233423; --panel: #2c3f2b; --panel2: #36502f;
  --ink: #f3ecd8; --ink2: #c3c9ad; --ink3: #8d977c;
  --wood: #8a5a33; --wood-l: #a06a3c; --wood-d: #3b2414;
  --gold: #e8b04a; --red: #e06a50; --green: #8fd05a; --blue: #8fd8ea;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 6px 6px;
  color: var(--ink); font-family: "Pixelify Sans", ui-monospace, "Consolas", monospace;
  font-size: 16px; line-height: 1.35; overflow-x: hidden;
  -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
a { color: inherit; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px;
  background: var(--wood); color: #fff3dc;
  border: 2px solid var(--wood-d); border-radius: 6px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.22), 0 3px 0 var(--wood-d);
  font-weight: 600; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.35);
  transition: transform .06s, box-shadow .06s, filter .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.22), 0 0 0 var(--wood-d); }
.btn.green { background: #4f8a2c; }
.btn.red { background: #9a3e2c; }
.btn.stone { background: #6f6a62; }
.btn.small { min-height: 36px; padding: 4px 10px; font-size: .9rem; }
.btn[disabled], .btn.off { filter: grayscale(.8) brightness(.7); pointer-events: none; }
.panel { background: var(--panel); border: 2px solid #121a12; border-radius: 8px; box-shadow: inset 0 2px 0 rgba(255,255,255,.06), 0 4px 0 #121a12; }

.screen { display: none; min-height: 100%; }
.screen.active { display: flex; flex-direction: column; }

/* ---------- Menü ---------- */
#menu { max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 28px; gap: 16px; }
.title { text-align: center; padding: 12px 0 4px; }
.title h1 { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 700; line-height: 1; color: var(--gold); text-shadow: 0 4px 0 #6b3d16, 0 8px 0 rgba(0,0,0,.35); letter-spacing: .03em; }
.title p { color: var(--ink2); margin-top: 10px; }
.top-links { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); grid-template-rows: auto; gap: 14px; }
.mapcard { padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; position: relative; transition: transform .1s; }
.mapcard:hover { transform: translateY(-2px); }
.mapcard.sel { outline: 3px solid var(--gold); outline-offset: 2px; }
.mapcard.locked { opacity: .55; pointer-events: none; }
.mapcard canvas { width: 100%; height: auto; border-radius: 4px; border: 2px solid #121a12; }
.mapcard h3 { font-size: 1.15rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.mapcard .sub { font-size: .85rem; color: var(--ink2); }
.mapcard .lock { position: absolute; inset: 10px 10px auto 10px; aspect-ratio: 480/288; display: flex; align-items: center; justify-content: center; background: rgba(10,14,10,.6); border-radius: 4px; font-size: 1rem; }
.diffstars { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: .78rem; color: var(--ink2); }
.diffstars span { display: inline-flex; align-items: center; gap: 3px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto; gap: 8px; }
.seg .btn { background: #4a3a2a; }
.seg .btn.on { background: var(--wood-l); outline: 2px solid var(--gold); }
.row { display: flex; align-items: center; gap: 12px; }
.row label { width: 70px; color: var(--ink2); }
.row input { flex: 1; accent-color: var(--gold); }
.row output { width: 34px; text-align: right; }
.settings { padding: 12px 14px; display: grid; gap: 6px; }
.hint { color: var(--ink3); font-size: .85rem; text-align: center; }

/* ---------- Spiel ---------- */
#game { height: 100%; height: 100dvh; padding: max(6px, env(safe-area-inset-top)) 8px max(6px, env(safe-area-inset-bottom)); gap: 6px; align-items: center; }
.hud { width: 100%; max-width: 1100px; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 36px; border-radius: 6px; background: var(--bg2); border: 2px solid #121a12; font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.stat img { width: 16px; height: 16px; image-rendering: pixelated; }
.stat.lives { color: #ffb4a4; }
.stat.gold { color: var(--gold); }
.hud .grow { flex: 1; }
.stagewrap { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#cv { border: 3px solid #121a12; border-radius: 6px; box-shadow: 0 6px 0 #0e150e; touch-action: none; }
#banner { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); padding: 8px 22px; font-size: clamp(1rem, 3.2vw, 1.5rem); font-weight: 700; color: #fff3dc; background: rgba(40,26,14,.88); border: 2px solid var(--gold); border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .3s; max-width: 92%; text-align: center; text-shadow: 0 2px 0 #000; }
#banner.on { opacity: 1; }
#bossbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(60%, 360px); pointer-events: none; }
#bossbar .name { font-size: .85rem; text-align: center; color: #ffd0c4; text-shadow: 0 2px 0 #000; }
#bossbar .bar { height: 10px; border: 2px solid #120808; background: #3a1410; border-radius: 3px; overflow: hidden; }
#bossbar .fill { height: 100%; background: linear-gradient(#e0604a, #a8321f); width: 100%; transition: width .15s; }
#tmenu { position: absolute; z-index: 10; padding: 8px; min-width: 180px; display: none; }
#tmenu.on { display: block; }
#tmenu h4 { font-size: 1rem; font-weight: 600; }
#tmenu .lvl { font-size: .8rem; color: var(--gold); }
#tmenu .desc { font-size: .8rem; color: var(--ink2); margin: 4px 0 8px; max-width: 200px; }
#tmenu .btns { display: grid; gap: 6px; }
.bar { width: 100%; max-width: 1100px; display: flex; gap: 6px; align-items: stretch; }
.towers { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: auto; gap: 5px; min-width: 0; }
.tb { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 2px 2px 3px; min-height: 64px; background: var(--bg2); border: 2px solid #121a12; border-radius: 6px; touch-action: none; transition: background .1s; }
.tb:hover { background: var(--panel2); }
.tb.armed { background: #5a4a22; outline: 2px solid var(--gold); }
.tb.poor { opacity: .45; }
.tb canvas { width: 32px; height: 40px; pointer-events: none; }
.tb .cost { font-size: .8rem; color: var(--gold); font-weight: 600; pointer-events: none; }
.tb .k { position: absolute; left: 4px; top: 2px; font-size: .65rem; color: var(--ink3); pointer-events: none; }
.bar.locked .tb { filter: grayscale(1) brightness(.6); pointer-events: none; }
#nextwave { min-width: 96px; flex-direction: column; gap: 0; line-height: 1.1; font-size: .95rem; }
#nextwave small { font-size: .7rem; font-weight: 400; opacity: .85; }
.abils { display: flex; gap: 5px; }
.ab { position: relative; width: 40px; height: 40px; border-radius: 6px; background: #3a2c1e; border: 2px solid #121a12; box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 3px 0 #0e150e; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.ab canvas { width: 24px; height: 24px; position: relative; z-index: 1; }
.ab .key { position: absolute; right: 2px; bottom: 0; font-size: .62rem; color: var(--ink2); z-index: 3; }
.ab .cd { position: absolute; inset: 0; z-index: 2; background: conic-gradient(rgba(8,10,8,.72) var(--p, 0%), transparent 0); }
.ab .sec { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; color: #fff3dc; text-shadow: 0 2px 0 #000; }
.ab.ready { animation: ready .5s; }
.ab.armed { outline: 2px solid var(--gold); background: #6a4a1e; }
@keyframes ready { 50% { transform: scale(1.12); } }
/* ---------- Kampagnenkarte ---------- */
.world { position: relative; padding: 8px; }
.world canvas { width: 100%; height: auto; border-radius: 4px; border: 2px solid #121a12; cursor: pointer; touch-action: manipulation; }
.detail { padding: 14px; display: grid; gap: 10px; }
.detail h3 { font-size: 1.35rem; font-weight: 700; color: var(--gold); }
.detail .sub { color: var(--ink2); font-size: .9rem; }
.abil-list { padding: 12px 14px; display: grid; gap: 8px; }
.abil-list h3 { font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between; }
.abrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; background: var(--bg2); border: 2px solid transparent; text-align: left; width: 100%; }
.abrow canvas { width: 28px; height: 28px; flex-shrink: 0; }
.abrow .txt { flex: 1; font-size: .85rem; color: var(--ink2); line-height: 1.3; }
.abrow .txt b { color: var(--ink); font-size: .95rem; display: block; }
.abrow .slot { min-width: 34px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 700; background: #1a2419; color: var(--ink3); border: 2px solid #121a12; font-size: .8rem; padding: 0 6px; }
.abrow.on { border-color: var(--gold); }
.abrow.on .slot { background: var(--wood-l); color: #fff3dc; }
.abrow.locked { opacity: .5; }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto auto; gap: 8px; }
.statgrid div { background: var(--bg2); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; }
.statgrid span { font-size: .72rem; color: var(--ink2); }
.statgrid b { font-size: 1.1rem; color: var(--gold); }
@media (max-width: 520px) { .statgrid { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; } }
.tip { position: fixed; z-index: 30; pointer-events: none; padding: 6px 10px; font-size: .8rem; max-width: 220px; display: none; }
.tip.on { display: block; }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(8,12,8,.62); }
.overlay.on { display: flex; }
.overlay .panel { width: 100%; max-width: 380px; padding: 20px; text-align: center; }
.overlay h2 { font-size: 2rem; font-weight: 700; color: var(--gold); text-shadow: 0 3px 0 #6b3d16; }
.overlay p { color: var(--ink2); margin: 8px 0 14px; }
.overlay .btns { display: grid; gap: 8px; }
.bigstars { display: flex; justify-content: center; gap: 10px; margin: 14px 0 6px; }
.bigstars canvas { width: 48px; height: 48px; }
.bigstars canvas.on { animation: pop .45s cubic-bezier(.3,1.7,.5,1) both; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }

@media (max-width: 640px) {
  .towers { grid-template-columns: repeat(4, 1fr); grid-template-rows: auto auto; }
  .tb { min-height: 54px; }
  .tb canvas { width: 26px; height: 32px; }
  .stat { font-size: .88rem; padding: 3px 5px; gap: 4px; }
  .hud { gap: 4px; }
  .hud .stat:nth-of-type(3) img { display: none; }
  .ab { width: 34px; height: 34px; }
  .ab canvas { width: 20px; height: 20px; }
  #nextwave { min-width: 76px; }
}
</style>
</head>
<body>

<section class="screen" id="menu"></section>

<section class="screen" id="game">
  <div class="hud">
    <button class="btn small stone" id="b-pause" aria-label="Pause">II</button>
    <span class="stat lives"><img id="ico-heart" alt=""><span id="h-lives">20</span></span>
    <span class="stat gold"><img id="ico-coin" alt=""><span id="h-gold">0</span></span>
    <span class="stat"><img id="ico-flag" alt=""><span id="h-wave">0/8</span></span>
    <span class="grow"></span>
    <div class="abils" id="abils"></div>
    <button class="btn small stone" id="b-speed" aria-label="Tempo">1×</button>
  </div>
  <div class="stagewrap" id="stagewrap">
    <canvas id="cv" width="480" height="288"></canvas>
    <div id="banner"></div>
    <div id="bossbar" hidden><div class="name">Trollhäuptling</div><div class="bar"><div class="fill" id="bossfill"></div></div></div>
    <div id="tmenu" class="panel"></div>
  </div>
  <div class="bar" id="bar">
    <div class="towers" id="towers"></div>
    <button class="btn green" id="nextwave">Welle 1<small>Leertaste</small></button>
  </div>
</section>

<div class="tip panel" id="tip"></div>
<div class="overlay" id="ov-pause"><div class="panel">
  <h2>Pause</h2><p>Bauen ist während der Pause gesperrt.</p>
  <div class="btns">
    <button class="btn green" data-p="resume">Weiter</button>
    <button class="btn" data-p="restart">Neu starten</button>
    <button class="btn red" data-p="quit">Aufgeben</button>
  </div>
</div></div>
<div class="overlay" id="ov-end"><div class="panel" id="endcard"></div></div>

<script>
"use strict";
// ============================================================
// CONFIG
// ============================================================
const TILE = 24, COLS = 20, ROWS = 12, W = COLS * TILE, H = ROWS * TILE;
const STEP = 1 / 60;
const tc = v => v * TILE + 12;   // Kachel → Pixelmitte

const DIFF = {
  easy:   { name: 'Leicht', hp: 0.7,  gold: 220, lives: 30 },
  normal: { name: 'Normal', hp: 1.0,  gold: 180, lives: 20 },
  hard:   { name: 'Schwer', hp: 1.25, gold: 160, lives: 12 },
};
const WAVE_BONUS = w => 30 + 6 * w;          // Gold für jede geschaffte Welle
const MAP_HP = [1, 1.05, 1.1, 1.0, 1.0, 1.05, 0.85, 0.55];   // Lebenspunkte-Faktor je Karte
const MAP_GOLD = i => 15 * i;                                // Startgold-Bonus späterer Karten
const NEW_ENEMY_TIP = {
  o: 'Neu: Oger – gepanzert, Armbrust und Gift helfen',
  b: 'Neu: Fledermäuse – fliegen direkt zur Burg, Ballista!',
  s: 'Neu: Schamane – heilt andere, Gift stoppt das',
  h: 'Neu: Schildträger – von vorn fast unverwundbar',
  l: 'Neu: Schleim – zerfällt in zwei kleine',
  x: 'Neu: Schatten – sichtbar nur nahe Glockentürmen oder direkt an Türmen',
  T: 'Der Trollhäuptling betäubt Türme in seiner Nähe!',
  W: 'Die Hexe verwandelt Türme kurz in Kürbisse!',
  N: 'Der Nekromant erweckt Gefallene als Skelette!',
  G: 'Der Steingolem zerfällt bei halbem Leben in drei Splitter!',
};

// Gegner: hp, Tempo (px/s), Rüstung, Gold, Burg-Schaden
const ENEMY = {
  k: { name: 'Kobold',       hp: 24,   sp: 34, armor: 0, gold: 6,   dmg: 1 },
  o: { name: 'Oger',         hp: 150,  sp: 17, armor: 5, gold: 18,  dmg: 2 },
  b: { name: 'Fledermaus',   hp: 34,   sp: 30, armor: 0, gold: 8,   dmg: 1, fly: 1 },
  s: { name: 'Schamane',     hp: 80,   sp: 21, armor: 0, gold: 16,  dmg: 1, heal: 1 },
  h: { name: 'Schildträger', hp: 90,   sp: 21, armor: 0, gold: 14,  dmg: 1, shield: 1 },
  l: { name: 'Schleim',      hp: 70,   sp: 23, armor: 0, gold: 8,   dmg: 1, split: 1 },
  m: { name: 'Schleimchen',  hp: 22,   sp: 32, armor: 0, gold: 3,   dmg: 1 },
  x: { name: 'Schatten',     hp: 55,   sp: 31, armor: 0, gold: 14,  dmg: 1, stealth: 1 },
  T: { name: 'Trollhäuptling', hp: 2600, sp: 11, armor: 6, gold: 250, dmg: 10, boss: 1 },
  z: { name: 'Skelett',      hp: 40,   sp: 26, armor: 0, gold: 1,   dmg: 1 },
  g: { name: 'Golemsplitter', hp: 520, sp: 13, armor: 6, gold: 30,  dmg: 3 },
  W: { name: 'Hexe',         hp: 2300, sp: 14, armor: 2, gold: 250, dmg: 10, boss: 1 },
  N: { name: 'Nekromant',    hp: 2500, sp: 12, armor: 3, gold: 250, dmg: 10, boss: 1 },
  G: { name: 'Steingolem',   hp: 3800, sp: 9,  armor: 10, gold: 150, dmg: 12, boss: 1 },
};

const TOWER = {
  archer:   { name: 'Bogenschütze', cost: 50,  up: [60, 110], range: [68, 78, 86],    rate: [0.75, 0.65, 0.6], dmg: [10, 15, 18],  air: 1, ground: 1, proj: 'arrow', multi: [1, 1, 3],
              desc: ['Günstig und schnell, trifft auch Flieger.', 'Mehr Reichweite und Schaden.', 'Drei Schützen – drei Ziele gleichzeitig.'] },
  cannon:   { name: 'Kanone',       cost: 90,  up: [90, 160], range: [60, 64, 70],    rate: [2.0, 1.8, 1.6],  dmg: [26, 40, 56], ground: 1, proj: 'ball', splash: [22, 28, 34], knock: [0, 0, 10],
              desc: ['Flächenschaden im Bogen – trifft keine Flieger.', 'Größerer Explosionsradius.', 'Doppelkanone, wirft Gegner zurück.'] },
  frost:    { name: 'Frostmagier',  cost: 70,  up: [70, 120], range: [58, 64, 70],    rate: [1.1, 1.0, 0.9],  dmg: [3, 5, 7],    air: 1, ground: 1, proj: 'ice', slow: [0.35, 0.5, 0.6], freeze: [0, 0, 0.18],
              desc: ['Verlangsamt Gegner.', 'Stärkeres Verlangsamen.', 'Friert Gegner manchmal komplett ein.'] },
  crossbow: { name: 'Armbrust',     cost: 100, up: [100, 170], range: [104, 118, 132], rate: [1.6, 1.4, 1.2], dmg: [38, 58, 85], ground: 1, proj: 'bolt', pierce: [0, 0, 1],
              desc: ['Große Reichweite, hoher Einzelschaden.', 'Mehr Schaden.', 'Durchschlägt Schild und Rüstung.'] },
  poison:   { name: 'Giftküche',    cost: 80,  up: [80, 140], range: [58, 62, 66],    rate: [1.6, 1.5, 1.4],  dps: [6, 9, 12],   ground: 1, proj: 'flask', dur: [4, 6, 6], cloud: [0, 0, 1],
              desc: ['Gift über Zeit, ignoriert Rüstung, stoppt Heilung.', 'Gift wirkt länger und stärker.', 'Giftwolke bleibt auf dem Weg liegen.'] },
  ballista: { name: 'Ballista',     cost: 90,  up: [90, 150], range: [112, 122, 134], rate: [1.4, 1.1, 1.1],  dmg: [45, 70, 60], air: 1, proj: 'spear', multi: [1, 1, 3],
              desc: ['Nur gegen Flieger – sehr stark.', 'Lädt schneller nach.', 'Dreifachbolzen gegen Schwärme.'] },
  bell:     { name: 'Glockenturm',  cost: 70,  up: [70, 120], aura: [56, 68, 80], buff: [0.15, 0.2, 0.25], haste: [0, 0, 0.2],
              desc: ['Verstärkt Türme im Umkreis, deckt Schatten auf.', 'Größerer Bereich, mehr Verstärkung.', 'Nachbartürme schießen zusätzlich schneller.'] },
  mine:     { name: 'Goldmine',     cost: 80,  up: [80, 140], income: [20, 35, 50], killBonus: [0, 0, 1],
              desc: ['Bringt nach jeder Welle Gold.', 'Mehr Gold pro Welle.', '+1 Gold für jeden Abschuss in der Nähe.'] },
};
const TOWER_KEYS = Object.keys(TOWER);
const TARGET_MODES = [['first', 'Erster'], ['strong', 'Stärkster'], ['near', 'Nächster']];

// Aktive Fähigkeiten – freigeschaltet über gesammelte Sterne (alle Karten × alle Schwierigkeiten)
const ABILITY = {
  fire: { name: 'Feuerregen',  cd: 35, target: 'area', r: 34, stars: 1,  desc: 'Meteore auf eine Stelle – hoher Flächenschaden, trifft auch Flieger.' },
  ice:  { name: 'Eiszeit',     cd: 50, stars: 3,  desc: 'Friert alle Gegner 3 s ein, danach sind sie verlangsamt.' },
  tax:  { name: 'Steuer',      cd: 60, stars: 6,  desc: 'Sofort Gold: 50 + 10 pro Welle.' },
  wall: { name: 'Mauer',       cd: 45, target: 'path', stars: 10, desc: 'Palisade auf dem Weg hält Bodentruppen bis zu 8 s auf.' },
  heal: { name: 'Burg heilen', cd: 90, stars: 15, desc: 'Stellt 5 Burg-Leben wieder her.' },
};
const ABILITY_KEYS = ['q', 'w', 'e'];
const EARLY_BONUS = w => 15 + 3 * w;         // Extragold, wenn die nächste Welle früher gerufen wird

// Kampagnenkarte: Orte 1–3 spielbar, 4–8 folgen in Phase 3
const WORLD_NODES = [
  { x: 62, y: 222 }, { x: 146, y: 150 }, { x: 246, y: 214 },
  { x: 300, y: 128, name: 'Fährfurt' }, { x: 372, y: 206, name: 'Nebelhain' }, { x: 428, y: 124, name: 'Hexenweiher' },
  { x: 352, y: 56, name: 'Steinbrücke' }, { x: 440, y: 40, name: 'Königsburg' },
];

// ============================================================
// KARTEN
// ============================================================
const MAPS = [
  {
    id: 'muehlbach', name: 'Mühlbach', sub: 'Zwei Wege, eine Brücke',

function hash(x, y) { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function dseg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, t = clamp(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(px - x1 - t * dx, py - y1 - t * dy);
}

function mapSegments(map) {

    case 'flask': ctx.fillStyle = '#7ae04a'; ctx.fillRect(x - 1, y - 1, 3, 3); ctx.fillStyle = '#dfe8ee'; ctx.fillRect(x, y - 2, 1, 1); break;

function drawFx(f) {
  const k = (G.time - f.t0) / (f.until - f.t0);
  switch (f.k) {
    case 'text':
      ctx.font = '8px "Pixelify Sans", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#1a1010'; ctx.fillText(f.text, Math.round(f.x) + 1, Math.round(f.y - k * 10) + 1);
      ctx.fillStyle = f.col; ctx.fillText(f.text, Math.round(f.x), Math.round(f.y - k * 10));
      break;
    case 'poof':
      ctx.fillStyle = f.col; ctx.globalAlpha = 1 - k;
      for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.fillRect(Math.round(f.x + Math.cos(a) * k * 9), Math.round(f.y + Math.sin(a) * k * 7), 2, 2); }
      ctx.globalAlpha = 1; break;
    case 'boom':
      ctx.globalAlpha = 1 - k; ctx.fillStyle = k < 0.4 ? '#ffe680' : '#e0902f';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5f5c58'; for (let i = 0; i < 5; i++) ctx.fillRect(Math.round(f.x + Math.cos(i * 1.3) * f.r * k), Math.round(f.y + Math.sin(i * 1.3) * f.r * k * 0.6), 2, 2);
      ctx.globalAlpha = 1; break;
    case 'ice': ctx.fillStyle = '#e6fbff'; ctx.globalAlpha = 1 - k; for (let i = 0; i < 4; i++) ctx.fillRect(Math.round(f.x + Math.cos(i * 1.57 + 0.7) * k * 6), Math.round(f.y + Math.sin(i * 1.57 + 0.7) * k * 6), 1, 1); ctx.globalAlpha = 1; break;
    case 'splash': ctx.fillStyle = '#7ae04a'; ctx.globalAlpha = 1 - k; for (let i = 0; i < 6; i++) ctx.fillRect(Math.round(f.x + Math.cos(i) * k * 10), Math.round(f.y + Math.sin(i) * k * 5), 2, 2); ctx.globalAlpha = 1; break;
    case 'spark': ctx.fillStyle = '#fff3a0'; ctx.fillRect(Math.round(f.x), Math.round(f.y), 2, 2); break;
    case 'plus': ctx.fillStyle = '#8ee05a'; ctx.globalAlpha = 1 - k; { const y = Math.round(f.y - k * 6); ctx.fillRect(Math.round(f.x) - 1, y - 2, 1, 5); ctx.fillRect(Math.round(f.x) - 3, y, 5, 1); } ctx.globalAlpha = 1; break;
    case 'ring': ctx.strokeStyle = `rgba(${f.col || '255,230,140'},${1 - k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * k, f.r * k * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); break;
    case 'frostflash':
      ctx.fillStyle = `rgba(190,235,255,${0.45 * (1 - k)})`; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(255,255,255,${1 - k})`;
      for (let i = 0; i < 60; i++) ctx.fillRect(Math.round(hash(i, 7) * W), Math.round((hash(i, 9) * H + k * 30) % H), 1, 1);
      break;
    case 'healglow':
      ctx.fillStyle = `rgba(142,224,90,${0.5 * (1 - k)})`; ctx.beginPath(); ctx.ellipse(f.x, f.y, 30 + k * 10, 34 + k * 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8ee05a'; for (let i = 0; i < 6; i++) { const yy = Math.round(f.y - k * 30 - i * 6); ctx.fillRect(Math.round(f.x - 20 + i * 8) - 1, yy - 2, 1, 5); ctx.fillRect(Math.round(f.x - 20 + i * 8) - 3, yy, 5, 1); }
      break;
    case 'scorch': break;
  }
}

}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (G && currentScreen === 'game' && !G.paused && !G.over) {
    acc += dt * G.speed;
    let n = 0;
    while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
    if (selected && !G.towers.includes(selected)) closeMenu();
  } else acc = 0;
  if (currentScreen === 'game') { render(); updateAbilBar(); }
  requestAnimationFrame(loop);
}

function endGame(won) {
  if (G.over) return;
  G.over = true; closeMenu(); armed = null; ghost = null; updateBar(); clearBoss();
  let stars = 0, newAbils = [];
  if (won) {
    const before = Object.keys(ABILITY).filter(abilUnlocked);
    stars = G.lives >= G.maxLives ? 3 : G.lives > G.maxLives / 2 ? 2 : 1;
    const ms = SV.stars[G.map.id] || (SV.stars[G.map.id] = {});
    ms[G.diff] = Math.max(ms[G.diff] || 0, stars);
    newAbils = Object.keys(ABILITY).filter(id => abilUnlocked(id) && !before.includes(id));
    const lo = loadout(); for (const id of newAbils) if (lo.length < 3) lo.push(id);
    persist();
  }
  stat('games'); if (won) stat('wins');
  let endlessLine = '';
  if (G.endless) {
    const reached = G.paid, rec = SV.endless[G.map.id] || (SV.endless[G.map.id] = {}), old = rec[G.diff] || 0;
    rec[G.diff] = Math.max(old, reached);
    endlessLine = `${reached} Wellen überstanden${reached > old ? ' · <b style="color:var(--gold)">Neuer Rekord!</b>' : ` · Rekord ${old}`}`;
  }
  persist();
  Sound.play(won ? 'win' : 'lose');
  const next = !G.endless && G.mapIdx + 1 < MAPS.length;
  $('#endcard').innerHTML = `
    <h2>${G.endless ? 'Endlos vorbei' : won ? 'Burg gehalten!' : 'Die Burg ist gefallen'}</h2>

    <p>${G.map.name} · ${DIFF[G.diff].name}${G.endless ? ' · Endlos' : ''}<br>${G.endless ? endlessLine : won ? `${G.lives} von ${G.maxLives} Leben übrig` : `Welle ${G.wave} von ${totalWaves()}`}</p>
    ${newAbils.map(id => `<p style="color:var(--gold);margin-top:-6px">Neue Fähigkeit: <b>${ABILITY[id].name}</b> – ${ABILITY[id].desc}</p>`).join('')}
    <div class="btns">
      ${won && next ? '<button class="btn green" data-e="next">Nächste Karte</button>' : ''}
      <button class="btn ${won ? '' : 'green'}" data-e="retry">${won ? 'Nochmal' : 'Nochmal versuchen'}</button>
      <button class="btn stone" data-e="menu">Kartenwahl</button>
    </div>`;
  if (won) {
    const box = $('#bigstars');
    for (let i = 0; i < 3; i++) {
      const c = document.createElement('canvas'); c.width = 10; c.height = 10; c.getContext('2d').drawImage(i < stars ? ICONS.star : ICONS.starOff, 0, 0);
      box.appendChild(c);

    }

}

// ============================================================
let currentScreen = 'menu', menuMap = 0;
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); currentScreen = id; }
// ----- Kampagnenkarte (Pixel-Weltkarte) -----
let worldLayer = null;
const worldSegs = () => WORLD_NODES.slice(1).map((n, i) => [WORLD_NODES[i].x, WORLD_NODES[i].y, n.x, n.y, i + 1]);
function buildWorldLayer() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x2 = c.getContext('2d'), img = x2.createImageData(W, H), Dt = img.data;
  const river = [[196, -10], [208, 50], [188, 110], [204, 170], [186, 240], [200, 300]];
  const lake = { cx: 100, cy: 262, rx: 30, ry: 14 };
  const segs = worldSegs(), sum = PALETTES.summer, moor = PALETTES.moor;
  const cache = {}, rgb = s => cache[s] || (cache[s] = [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = hash(x, y);
    let e = Infinity;
    for (let i = 0; i < river.length - 1; i++) e = Math.min(e, dseg(x, y, ...river[i], ...river[i + 1]) - 7);
    e = Math.min(e, (Math.hypot((x - lake.cx) / lake.rx, (y - lake.cy) / lake.ry) - 1) * lake.ry);
    e += (hash(x >> 2, y >> 2) - 0.5) * 2;
    let dt = Infinity, segIdx = 0;
    for (const s of segs) { const d = dseg(x, y, s[0], s[1], s[2], s[3]); if (d < dt) { dt = d; segIdx = s[4]; } }
    const playable = segIdx < MAPS.length;
    const isMoor = Math.hypot(x - 246, y - 214) < 46 + hash(x >> 3, y >> 3) * 8;
    const snow = Math.hypot(x - 404, (y - 30) * 1.5) < 76 + hash(x >> 3, y >> 3) * 10;
    const pal = isMoor ? moor : sum;
    let col;
    if (e < 0) col = dt < 2.5 ? ((x % 3 === 0) ? '#6b4426' : '#a06a3c') : (e > -3 ? pal.w[2] : (n < 0.5 ? pal.w[0] : pal.w[1]));
    else if (e < 2) col = pal.sand[0];
    else if (dt < 2.6) col = playable ? (n < 0.2 ? pal.dirt[1] : pal.dirt[0]) : ((((x + y) >> 2) & 1) ? '#c9b78f' : pal.g[0]);
    else if (snow) col = n < 0.3 ? '#dfe8ee' : n > 0.9 ? '#b9c8d2' : '#eef4f6';
    else { col = n < 0.25 ? pal.g[1] : n > 0.86 ? pal.g[2] : pal.g[0]; if (!isMoor && n < 0.006) col = '#f2d04a'; else if (!isMoor && n < 0.01) col = '#fff3d6'; }
    const [r, g, b] = rgb(col), i = (y * W + x) * 4; Dt[i] = r; Dt[i + 1] = g; Dt[i + 2] = b; Dt[i + 3] = 255;
  }
  x2.putImageData(img, 0, 0);
  dctx = x2;
  // Berge
  const mountain = (cx, by, h, snowy) => {
    for (let r = 0; r < h; r++) {
      const half = Math.round((r + 1) / h * h * 0.9);
      D(cx - half, by - h + r, half, 1, r < h * 0.3 ? '#eef4f6' : '#9a958c');
      D(cx, by - h + r, half, 1, r < h * 0.3 ? (snowy ? '#cfdbe2' : '#dfe8ee') : '#7a756c');
    }
    D(cx - Math.round(h * 0.9), by, Math.round(h * 1.8), 1, '#5f5c58');
  };
  [[26, 70, 30], [62, 56, 36], [104, 72, 26], [150, 60, 30], [240, 66, 28], [282, 50, 24]].forEach(([x, y, h]) => mountain(x, y, h));
  [[396, 92, 30, 1], [470, 96, 26, 1]].forEach(([x, y, h, s]) => mountain(x, y, h, s));
  const objs = [];
  [['P', 20, 150], ['R', 40, 186], ['P', 116, 206], ['P', 236, 120], ['R', 276, 172], ['P', 316, 186], ['R', 404, 168], ['P', 462, 196], ['R', 332, 254], ['P', 424, 258], ['R', 466, 262], ['P', 18, 112], ['R', 108, 104], ['P', 272, 98], ['R', 160, 252], ['P', 300, 276]]
    .forEach(([t, x, y]) => objs.push({ y, f: () => t === 'P' ? drawPine(x, y, false) : drawRound(x, y, 0.75) }));
  [[222, 194], [272, 240], [214, 236]].forEach(([x, y]) => objs.push({ y, f: () => drawDead(x, y) }));
  [[118, 136], [176, 140]].forEach(([x, y]) => objs.push({ y, f: () => drawHouse(x, y) }));
  objs.sort((a, b) => a.y - b.y).forEach(o => o.f());
  return c;
}
function drawWorld(sel) {
  const c = $('#worldcv'); if (!c) return;
  if (!worldLayer) worldLayer = buildWorldLayer();
  const x = c.getContext('2d'); x.drawImage(worldLayer, 0, 0);
  dctx = x;
  WORLD_NODES.forEach((nd, i) => {
    const real = i < MAPS.length, un = real && mapUnlocked(i);
    const st = real ? Math.max(0, ...Object.values(mapStars(MAPS[i].id))) : 0;
    if (i === sel) { x.strokeStyle = '#ffe680'; x.lineWidth = 1.5; x.setLineDash([3, 2]); x.beginPath(); x.ellipse(nd.x, nd.y + 2, 17, 9, 0, 0, Math.PI * 2); x.stroke(); x.setLineDash([]); }
    D(nd.x - 9, nd.y - 1, 18, 5, '#5f5c58'); D(nd.x - 8, nd.y - 2, 16, 4, '#9a958c'); D(nd.x - 7, nd.y - 2, 14, 1, '#b8b0a3');
    if (real) {
      D(nd.x - 1, nd.y - 22, 2, 21, '#5c3a20');
      const fc = !un ? '#6f6a62' : st ? '#e8b04a' : '#b5473a';
      D(nd.x + 1, nd.y - 22, 10, 6, fc); D(nd.x + 1, nd.y - 16, 7, 1, fc); D(nd.x + 1, nd.y - 22, 10, 1, 'rgba(255,255,255,.3)');
      x.font = '8px "Pixelify Sans", monospace'; x.textAlign = 'center'; x.fillStyle = '#241c1c'; x.fillText(String(i + 1), nd.x + 6, nd.y - 16);
      for (let s = 0; s < 3; s++) { const sx = nd.x - 7 + s * 6, sy = nd.y + 7, on = s < st; D(sx, sy - 1, 1, 3, on ? '#ffd36a' : '#3a4a32'); D(sx - 1, sy, 3, 1, on ? '#ffd36a' : '#3a4a32'); }
      if (!un) { D(nd.x - 3, nd.y - 9, 6, 5, '#3a3a3a'); D(nd.x - 2, nd.y - 12, 4, 3, '#3a3a3a'); D(nd.x - 1, nd.y - 11, 2, 2, '#9a958c'); }
    } else {
      D(nd.x - 1, nd.y - 16, 2, 15, '#6b4426');
      D(nd.x - 7, nd.y - 18, 14, 8, '#a06a3c'); D(nd.x - 7, nd.y - 18, 14, 1, '#c99a5f'); D(nd.x - 7, nd.y - 11, 14, 1, '#6b4426');
      x.font = '8px "Pixelify Sans", monospace'; x.textAlign = 'center'; x.fillStyle = '#3b2414'; x.fillText('?', nd.x, nd.y - 11);
    }
  });
}
function renderMenu() {
  const diff = SV.diff, i = menuMap, real = i < MAPS.length, m = real ? MAPS[i] : null;
  const un = real && mapUnlocked(i), st = real ? mapStars(m.id) : {};
  const lo = loadout();
  let detail;
  if (!real) detail = `<h3>${WORLD_NODES[i].name}</h3><div class="sub">Dieser Ort ist noch im Nebel – kommt in Phase 3 mit neuen Karten und Bossen.</div>`;
  else if (!un) detail = `<h3>${i + 1}. ${m.name}</h3><div class="sub">Gesperrt – schaffe zuerst „${MAPS[i - 1].name}“ auf beliebiger Schwierigkeit.</div>`;
  else detail = `<h3>${i + 1}. ${m.name}</h3><div class="sub">${m.sub} · ${m.waves.length} Wellen</div>
      <div class="diffstars">${Object.keys(DIFF).map(d => `<span>${DIFF[d].name} <b style="color:var(--gold)">${'★'.repeat(st[d] || 0)}</b><span style="color:var(--ink3)">${'★'.repeat(3 - (st[d] || 0))}</span></span>`).join('')}</div>
      <div class="seg">${Object.keys(DIFF).map(d => `<button class="btn small ${d === diff ? 'on' : ''}" data-diff="${d}">${DIFF[d].name}</button>`).join('')}</div>
      <button class="btn green" data-start style="min-height:54px;font-size:1.2rem">Spielen: ${m.name}</button>
      ${Object.values(st).some(s => s > 0)
        ? `<button class="btn stone" data-endless>Endlosmodus · Rekord ${((SV.endless[m.id] || {})[diff]) || 0} Wellen</button>`
        : '<div class="sub">Endlosmodus: schaffe diese Karte einmal.</div>'}`;
  $('#menu').innerHTML = `
    <div class="top-links"><a class="btn small stone" href="kopfsache.html">‹ Kopfsache</a><span class="hint">★ ${totalStars()} / ${maxStars()}</span></div>
    <div class="title"><h1>Burgwacht</h1><p>Halte die Burg. Baue Türme, rüste sie auf, lass keinen durch.</p></div>
    <div class="panel world"><canvas id="worldcv" width="480" height="288" aria-label="Kampagnenkarte"></canvas></div>
    <div class="panel detail">${detail}</div>
    <div class="panel abil-list">
      <h3><span>Fähigkeiten</span><span style="font-size:.85rem;color:var(--ink2)">bis zu 3 auf Q / W / E</span></h3>
      ${Object.keys(ABILITY).map(id => {
        const a = ABILITY[id], ok = abilUnlocked(id), slot = lo.indexOf(id);
        return `<button class="abrow ${slot >= 0 ? 'on' : ''} ${ok ? '' : 'locked'}" data-abil="${id}">
          <canvas width="12" height="12" data-abicon="${id}"></canvas>
          <span class="txt"><b>${a.name}</b>${a.desc} · Abklingzeit ${a.cd} s</span>
          <span class="slot">${!ok ? '★ ' + a.stars : slot >= 0 ? ABILITY_KEYS[slot].toUpperCase() : '–'}</span>
        </button>`;
      }).join('')}
      <p class="hint" style="text-align:left">Sterne gibt es auf jeder Schwierigkeit einzeln – auch Wiederholen lohnt sich.</p>
    </div>
    <div class="panel abil-list">
      <h3><span>Statistik</span></h3>
      <div class="statgrid">${[
        ['Partien', SV.stats.games || 0], ['Siege', SV.stats.wins || 0], ['Gegner besiegt', SV.stats.kills || 0], ['Bosse besiegt', SV.stats.bossKills || 0],
        ['Türme gebaut', SV.stats.built || 0], ['Ausbauten', SV.stats.upgrades || 0], ['Fähigkeiten', SV.stats.abilities || 0], ['Gold verdient', SV.stats.goldEarned || 0],
      ].map(([l, v]) => `<div><span>${l}</span><b>${v.toLocaleString('de-DE')}</b></div>`).join('')}</div>
      <div class="sub" style="font-size:.85rem;color:var(--ink2)">Endlos-Rekorde: ${MAPS.filter(mm => SV.endless[mm.id]).map(mm => `${mm.name} ${Math.max(...Object.values(SV.endless[mm.id]))}`).join(' · ') || 'noch keine'}</div>
      <button class="btn small red" data-reset style="justify-self:start">Fortschritt zurücksetzen</button>
    </div>
    <div class="panel settings">
      <div class="row"><label>Effekte</label><input type="range" min="0" max="100" value="${Math.round(SV.settings.sfx * 100)}" data-set="sfx"><output>${Math.round(SV.settings.sfx * 100)}</output></div>
      <div class="row"><label>Musik</label><input type="range" min="0" max="100" value="${Math.round(SV.settings.music * 100)}" data-set="music"><output>${Math.round(SV.settings.music * 100)}</output></div>
    </div>
    <p class="hint">PC: 1–8 Turm wählen · Q/W/E Fähigkeiten · Leertaste Welle (läuft eine, ruft sie die nächste früher) · F Tempo · P Pause · U ausbauen · S verkaufen<br>Handy: Türme aus der Leiste aufs Gras ziehen – im Querformat spielt es sich am besten.</p>`;
  drawWorld(i);
  document.querySelectorAll('[data-abicon]').forEach(c => c.getContext('2d').drawImage(ABIL_ICONS[c.dataset.abicon], 0, 0));
  document.querySelectorAll('[data-set]').forEach(inp => {
    inp.addEventListener('input', () => { SV.settings[inp.dataset.set] = inp.value / 100; inp.nextElementSibling.textContent = inp.value; Sound.unlock(); Sound.apply(); });
    inp.addEventListener('change', () => { persist(); if (inp.dataset.set === 'sfx') Sound.play('coin'); });
  });
  $('#worldcv').addEventListener('pointerdown', e => {
    const r = e.currentTarget.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    let best = -1, bd = 22;
    WORLD_NODES.forEach((nd, k) => { const d = Math.hypot(nd.x - x, nd.y - 8 - y); if (d < bd) { bd = d; best = k; } });
    if (best >= 0) { menuMap = best; Sound.unlock(); Sound.play('click'); renderMenu(); }
  });
}
$('#menu').addEventListener('click', e => {
  const d = e.target.closest('[data-diff]'); if (d) { SV.diff = d.dataset.diff; persist(); Sound.play('click'); renderMenu(); return; }
  const ab = e.target.closest('[data-abil]');
  if (ab) {
    const id = ab.dataset.abil; if (!abilUnlocked(id)) { Sound.play('deny'); return; }
    const lo = loadout();
    if (lo.includes(id)) SV.loadout = lo.filter(x => x !== id);
    else if (lo.length < 3) SV.loadout = [...lo, id];
    else { Sound.play('deny'); const n = ab.querySelector('.slot'); n.textContent = 'voll'; setTimeout(() => renderMenu(), 900); return; }
    persist(); Sound.play('click'); renderMenu(); return;
  }
  if (e.target.closest('[data-start]')) { Sound.unlock(); Sound.play('click'); startGame(menuMap, SV.diff); return; }
  if (e.target.closest('[data-endless]')) { Sound.unlock(); Sound.play('click'); startGame(menuMap, SV.diff, true); return; }
  const rs = e.target.closest('[data-reset]');
  if (rs) {
    if (rs.dataset.sure) {
      const keep = SV.settings; localStorage.removeItem(SAVE_KEY); SV = loadSave(); SV.settings = keep; persist();
      menuMap = 0; worldLayer = null; Sound.play('sell'); renderMenu();
    } else { rs.dataset.sure = '1'; rs.textContent = 'Wirklich alles löschen? Nochmal tippen'; Sound.play('deny'); setTimeout(() => { if (rs.isConnected) { delete rs.dataset.sure; rs.textContent = 'Fortschritt zurücksetzen'; } }, 3500); }
  }
});
function openMenuScreen() { G = null; closeMenu(); Sound.setBoss(false); $('#bossbar').hidden = true; show('menu'); renderMenu(); }
function startGame(i, diff, endless = false) {
  $('#ov-end').classList.remove('on'); $('#ov-pause').classList.remove('on');
  show('game'); newGame(i, diff, endless); armed = null; ghost = null; selected = null;
  G.speed = 1; $('#b-speed').textContent = '1×';
  requestAnimationFrame(fit);
  if (!SV.seenHint) { setTimeout(() => banner('Türme aus der Leiste aufs Gras ziehen'), 300); SV.seenHint = true; persist(); }
  else banner(MAPS[i].name + (endless ? ' · Endlos' : ''));
  if (MAPS[i].fog) setTimeout(() => banner('Nebel: −30 % Reichweite, Glockentürme lichten ihn', 3000), 1700);
  else if (MAPS[i].slow.length) setTimeout(() => banner('Furt und Matsch bremsen Bodentruppen', 3000), 1700);
}

buildBar();
menuMap = Math.max(0, MAPS.findIndex((m, i) => mapUnlocked(i) && !Object.keys(mapStars(m.id)).length));
if (menuMap < 0) menuMap = 0;
openMenuScreen();
</script>
